{% extends 'header.html' %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/rules.css') }}">

<h1 align="center">Чёрный список</h1>
<table align="center">
    <thead>
        <tr>
            <th>Номер телефона</th>
            <th>Причина добавления</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <form method="post">
                <td><input type="text" name="phone"></td>
                <td><input type="text" name="comment"></td>
                <td><input type="submit" value="Добавить"></td>
            </form>
        </tr>
        {% if message %}
        <tr>
            <td colspan="3" class="{% if 'добавлен' in message %}flash-success{% else %}flash-error{% endif %}">
                {{ message }}
            </td>
        </tr>
        {% endif %}
        {% for row in black_list %}
        <tr>
            <td><b>{{ row.phone }}</b></td>
            <td>{{ row.comment }}</td>
            <td><input type="button" value="Удалить" onClick='location.href="/delete/{{ row.phone }}"'></td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
